# KathaPulse AI — production ingress (nginx).
#
# Install as /etc/nginx/conf.d/kathapulse.conf on the edge host that terminates
# TLS in front of `uvicorn app.main:app` (127.0.0.1:8000, the Dockerfile default).
#
# What this file is responsible for, and why:
#   * TLS termination + HSTS      — the app never sets HSTS itself; it cannot know
#                                  whether the hop is TLS.
#   * rate limiting              — the app has none, and /verify-strip can call a
#                                  paid vision model, so the budget belongs at the edge.
#   * schema occlusion           — /docs, /redoc, /openapi.json return 404 here and in
#                                  the app (KATHA_DOCS_ENABLED=0 is the default).
#   * upload ceiling             — 7 MiB at the proxy vs the app's 6 MiB, so the app's
#                                  own 413 message is what the user actually sees.
#   * WebSocket upgrade          — /ws/relay/ needs HTTP/1.1 upgrade headers; a
#                                  default nginx location silently breaks the handshake.
#
# Adjust `server_name`, certificate paths and the rate numbers to the deployment.

# 30 scans per minute per IP: a person scanning a basket of four strips does at
# most a handful, so this only stops automation. Reads are cheaper and looser.
limit_req_zone $binary_remote_addr zone=kp_scan:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=kp_read:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=kp_conn:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream kathapulse_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Plain HTTP exists only to redirect. No content is ever served over it.
server {
    listen 80;
    listen [::]:80;
    server_name kathapulse.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kathapulse.example.org;

    ssl_certificate     /etc/letsencrypt/live/kathapulse.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kathapulse.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Two years, subdomains, preload-eligible. Only add `preload` once the whole
    # domain is HTTPS-only — it is hard to walk back.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    server_tokens off;                # no nginx version in responses or error pages
    client_max_body_size 7m;          # slightly above the app's 6 MiB, see header
    client_body_timeout 20s;
    keepalive_timeout 30s;

    access_log /var/log/nginx/kathapulse.access.log;
    error_log  /var/log/nginx/kathapulse.error.log warn;

    # -- schema occlusion ---------------------------------------------------
    # The app already answers these with 404 (KATHA_DOCS_ENABLED default off);
    # blocking them here keeps even the 404 shape away from scanners.
    location = /docs                 { return 404; }
    location = /redoc                { return 404; }
    location = /openapi.json         { return 404; }
    location = /docs/oauth2-redirect { return 404; }

    # -- scan endpoints: the rate-limited, upload-bearing paths -------------
    location = /verify-strip {
        limit_req  zone=kp_scan burst=5 nodelay;
        limit_conn kp_conn 4;
        limit_req_status 429;
        proxy_pass http://kathapulse_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # stream to the app; never spool a photo to disk
        proxy_read_timeout 30s;
    }

    location = /verify-medicines {
        limit_req  zone=kp_scan burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://kathapulse_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location = /verify-strips/batch {
        limit_req  zone=kp_scan burst=3 nodelay;
        limit_conn kp_conn 2;
        limit_req_status 429;
        proxy_pass http://kathapulse_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 45s;
    }

    # -- pharmacist relay: WebSocket upgrade required ----------------------
    location /ws/relay/ {
        limit_conn kp_conn 4;
        proxy_pass http://kathapulse_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 300s;      # idle relay sessions are dropped after 5 min
        proxy_send_timeout 300s;
    }

    # -- static shell + taxonomy feed --------------------------------------
    location ~ ^/(static/|taxonomy\.json$|sw\.js$) {
        limit_req zone=kp_read burst=60 nodelay;
        proxy_pass http://kathapulse_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 512;
        # /sw.js must stay revalidated: a cached service worker is how a bad
        # deploy keeps itself alive.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location = /health {
        access_log off;
        proxy_pass http://kathapulse_app;
        proxy_set_header Host $host;
    }

    location / {
        limit_req zone=kp_read burst=60 nodelay;
        proxy_pass http://kathapulse_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
